<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyHub - Video & PDF Learning</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <div class="logo">
            Study<span>Hub</span>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#library">My Library</a>
            <a href="#upload">Upload</a>
        </nav>
    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- Hero Section -->

        <section class="hero">

            <h1>My Learning Library</h1>

            <p>
                Upload your lectures, videos and PDF notes in one place.
            </p>


            <!-- Upload Box -->

            <div class="upload-area" id="upload">

                <h2>📚 Add Course Material</h2>

                <p>
                    Select one or multiple video/PDF files.
                </p>


                <label class="btn" for="fileInput">
                    ＋ Upload Files
                </label>

                <input
                    type="file"
                    id="fileInput"
                    multiple
                    accept="video/*,application/pdf,.pdf"
                >


                <button
                    class="btn secondary"
                    onclick="clearAll()"
                >
                    Clear Library
                </button>

            </div>

        </section>


        <!-- ================= STATS ================= -->

        <div class="stats">

            <div class="stat">
                Videos:
                <b id="videoCount">0</b>
            </div>

            <div class="stat">
                PDFs:
                <b id="pdfCount">0</b>
            </div>

            <div class="stat">
                Total:
                <b id="totalCount">0</b>
            </div>

        </div>


        <!-- ================= LIBRARY ================= -->

        <section id="library">

            <!-- Filter Buttons -->

            <div class="tabs">

                <button
                    class="tab active"
                    onclick="filterItems('all', this)"
                >
                    All
                </button>

                <button
                    class="tab"
                    onclick="filterItems('video', this)"
                >
                    Videos
                </button>

                <button
                    class="tab"
                    onclick="filterItems('pdf', this)"
                >
                    PDF Notes
                </button>

            </div>


            <!-- Uploaded Files -->

            <div
                class="grid"
                id="grid"
            >

                <div class="empty">

                    No files yet.
                    Upload your first video or PDF.

                </div>

            </div>

        </section>

    </main>


    <!-- ================= VIEWER MODAL ================= -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-box">

            <button
                class="close"
                onclick="closeViewer()"
            >
                ×
            </button>

            <div id="viewer"></div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
